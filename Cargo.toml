[package]
name = "flaborful-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "flaborful-api"
path = "src/main.rs"

[dependencies]
# Text extraction from uploaded portfolio/resume PDFs (Phase 3 file ingestion).
pdf-extract = "0.7"
# Web framework
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }

# Auth
jsonwebtoken = "9"
bcrypt = "0.15"

# HTTP client (for inference + OAuth calls)
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Config / env
dotenvy = "0.15"

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Vector DB
qdrant-client = "1.10.1"
fastembed = "5.12.1"

# Encryption (for stored credentials)
aes-gcm = "0.10"
base64 = "0.21"
rand = "0.8"
urlencoding = "2.1.3"
rustls = { version = "0.23", features = ["ring"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
async-stream = "0.3.6"
tokio-stream = "0.1.18"
futures = "0.3.32"
async-trait = "0.1"

# Sprites WSS exec (binary frame protocol over WebSocket)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# Constant-time comparison for webhook secret + SHA-256
subtle = "2"
hex = "0.4"
