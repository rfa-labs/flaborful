app = 'flaborful-api'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  RUST_LOG = 'flaborful_api=info,tower_http=info'
  RUST_BACKTRACE = '1'
  # The SPA baked into the image (see the Dockerfile's `web` stage). The binary serves it
  # from here via ServeDir + SPA fallback, on the same origin as /api/v1.
  WEB_DIR = '/srv/web'

  # Public origin. URLs, not secrets — so they live here rather than in `fly secrets`.
  #
  # API_BASE_URL is the address external services call *back* into: the RunPod training webhook
  # (lora_training.rs) and the sprite/ingestion callbacks (workflow_engine.rs, onboarding/ingest.rs).
  # Its in-code defaults disagree with each other (`https://api.flaborful.com` in one place,
  # `http://localhost:8080` in three others), so it must be set explicitly or training completion
  # and repo ingestion fail silently.
  #
  # The OAuth callbacks are *frontend* routes (web/src/routes/auth/*/callback/). The binary serves
  # the SPA and the API on one origin, so they share this host. These must also be registered as
  # the callback URL in the GitHub OAuth app settings.
  API_BASE_URL = 'https://flaborful-api.fly.dev'
  GITHUB_OAUTH_REDIRECT_URI = 'https://flaborful-api.fly.dev/auth/github/callback'
  GOOGLE_OAUTH_REDIRECT_URI = 'https://flaborful-api.fly.dev/auth/google/callback'
  OPTIMIZER_BASE_URL= 'https://rfa-labs.com/v1'

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale to zero: the workflow engine drives long-running coding-agent tasks (clone →
  # edit → test → PR) that outlive any request, and suspending the machine mid-task would
  # strand them. It also holds in-flight SSE streams open for the live DAG view.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    timeout = '5s'
    path = '/api/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  # 1GB: the fastembed ONNX runtime + its model don't fit in 512mb (optimizer hit the same
  # floor with the same dependency). Bump further if concurrency rises.
  memory = '1gb'
