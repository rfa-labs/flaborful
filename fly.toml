app = 'flaborful-api'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  RUST_LOG = 'flaborful_api=info,tower_http=info'
  RUST_BACKTRACE = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    timeout = '5s'
    path = '/api/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = 512
